# values-es.yaml
global:
  imageRegistry: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"
  security:
    allowInsecureImages: true # 跳过非官方镜像校验
  defaultStorageClass: "local-path"
  storageClass: "local-path"
image:
  registry: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io
  repository: bitnami/elasticsearch
  tag: 9.0.3-debian-12-r1

master:
  replicaCount: 1          # master单实例
  masterOnly: false        # master同时兼任data/ingest
  persistence:
    enabled: true
    size: 30Gi
    storageClass: "local-path"
data:
  replicaCount: 0          # 关闭独立data节点
coordinating:
  replicaCount: 0          # 关闭协调节点
ingest:
  replicaCount: 0          # 关闭独立ingest
# ES内核配置：单节点必开single-node
esConfig:
  elasticsearch.yml: |
    discovery.type: single-node          # 单机最关键，不再寻找集群节点
    node.roles: [master,data,ingest]    # 当前节点全角色
    cluster.routing.allocation.disk.threshold_enabled: false
# 索引默认副本0（单机无法分片副本，否则分片unassigned）
cluster:
  replicas: 0
#==========单机关键配置 end==========

# 安全配置：测试关闭xpack密码，生产开启
security:
  enabled: false
  elasticsearchPassword: "Es@123456"

# JVM堆（根据机器内存调整，推荐内存一半，2G内存配-Xms1g -Xmx1g）
esJavaOpts: "-Xms1g -Xmx4g"

# 资源限制
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 6Gi
    
# Service暴露：NodePort方便外部访问9200
service:
  type: NodePort
  ports:
    restAPI: 9200
    transport: 9300
  nodePorts:
    restAPI: 9200
    transport: 9300

# 系统权限优化（解决max_map_count报错）
sysctl:
  enabled: true
